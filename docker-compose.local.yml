services:
  backend:
    mem_limit: 4g
    environment:
      SCAN_ROOTS: /scan
      SCANNER_DB: /data/scanner.db
      MALLOC_ARENA_MAX: 2
      VIPS_CONCURRENCY: 2
    volumes:
      - ${SCAN_DIR:-/mnt/nas/pool/weibo/scanDir}:/scan
      - ${SOURCE_DIR:-/mnt/nas/pool/weibo/weibo_sync}:/source
      - scanner-data:/data

  frontend:
    mem_limit: 256m
    ports:
      - "0.0.0.0:${FRONTEND_PORT:-8080}:80"
