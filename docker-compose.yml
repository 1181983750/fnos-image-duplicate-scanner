services:
  backend:
    build: ./backend
    environment:
      SCAN_ROOTS: /scan
      SCANNER_DB: /data/scanner.db
    volumes:
      - ${SCAN_DIR:-/mnt/unraid/pool/weibo/scanDir}:/scan
      - scanner-data:/data
    ports:
      - "0.0.0.0:${BACKEND_PORT:-18000}:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "0.0.0.0:${FRONTEND_PORT:-8080}:80"

volumes:
  scanner-data:
